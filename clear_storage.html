<!DOCTYPE html>
<html>
<head>
    <title>Clear LocalStorage</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 40px; }
        button { padding: 15px 30px; font-size: 18px; background: red; color: white; border: none; cursor: pointer; }
        button:hover { background: darkred; }
    </style>
</head>
<body>
    <h1>Clear Storage & Reload</h1>
    <p>This will clear all data and reload with sample donors</p>
    <button onclick="clearAndReload()">Clear & Reload</button>

    <script>
        function clearAndReload() {
            localStorage.clear();
            window.open('index.php', '_self');
        }
    </script>
</body>
</html>
